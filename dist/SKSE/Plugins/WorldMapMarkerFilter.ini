; World Map Marker Filter. Read when the game starts.

[Debug]
; 2 = info. Lower numbers write more to My Games\Skyrim Special Edition\SKSE\WorldMapMarkerFilter.log (0 = everything).
uLogLevel=2

[Keys]
; What opens and closes the panel, in the world map only. Outside the world map both presses are left to the game.
; Keyboard key, as a DirectInput scan code in hexadecimal. 0x35 is the / key. 0x00 turns it off.
; A letter works but cannot then close the panel, since letters type into the search while it is open.
iToggleKey=0x35
; Controller button, as an XInput button mask in hexadecimal. 0x0004 is D-pad left. 0x0000 turns it off.
; 0x0001 D-pad up, 0x0002 D-pad down, 0x0004 D-pad left, 0x0008 D-pad right, 0x0040 left stick click, 0x0080 right stick click,
; 0x0100 left bumper, 0x0200 right bumper.
iTogglePad=0x0004

[Panel]
; Width, as a percentage of the screen width (15 through 40).
iWidthPercent=22
; Text size, as a percentage of the menu's normal size (80 through 160).
iTextScalePercent=100
; The hint in the world map's button bar, with the button or key above. 0 hides it.
bShowKeyHint=1
